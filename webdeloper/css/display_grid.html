<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    .parent{
        width: 100%;
        height: 100vh;
        display: grid;
        gap: 5px;
        text-align: center;
        font-size: 20px;
        grid-template-columns: repeat(5,165px) ;
        /* grid-template-rows: repeat(5,200px); */
        grid-auto-rows: 70px;
    }
   
    .parent div{
        background-color: rgb(188, 6, 127);
        border-radius: 10px;
    }
    .parent :first-child{
        grid-column: span 5;
    }
    .parent :nth-child(4){
        grid-column: span 2;
    }
    .parent :nth-child(6){
        grid-column: span 2;
    }
    .parent :nth-child(10){
        grid-column: span 2;
    }
    .parent :nth-child(12){
        grid-column: span 2;
    }
    .parent :nth-child(16){
        grid-column: span 2;
    }
    .parent :nth-child(18){
        grid-column: span 2;
    }
    .parent :nth-child(20){
        grid-column: span 5;
    }
    
    .parent :nth-child(2){
        grid-row: span 2;
    }
    .parent :nth-child(3){
        grid-row: span 2;
    }
    .parent :nth-child(8){
        grid-row: span 2;
    }
    .parent :nth-child(9){
        grid-row: span 2;
    }
    .parent :nth-child(14){
        grid-row: span 2;
    }
    .parent :nth-child(15){
        grid-row: span 2;
    }
    
    
    
    
    
</style>
<body>
    <div class="parent">
        <div class="child1">1</div>
        <div class="child2">2</div>
        <div class="child3">3</div>
        <div class="child4">4</div>
        <div class="child5">5</div>
        <div class="child6">6</div>
        <div class="child7">7</div>
        <div class="child8">8</div>
        <div class="child9">9</div>
        <div class="child10">10</div>
        <div class="child10">11</div>
        <div class="child10">12</div>
        <div class="child10">13</div>
        <div class="child10">14</div>
        <div class="child10">15</div>
        <div class="child10">16</div>
        <div class="child10">17</div>
        <div class="child10">18</div>
        <div class="child10">19</div>
        <div class="child10">20</div>
       
    </div>
</body>
</html>
