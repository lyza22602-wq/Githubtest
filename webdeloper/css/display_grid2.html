<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    .parent{
        width: 100%;
        height: 100vh;
        display: grid;
        grid-template-columns: repeat(3,270px);
        grid-auto-rows: 100px;
        text-align: center;
        gap: 10px;
    }
    .parent div{
       display: flex;
       align-items: center;
       justify-content: center; 
       color: aliceblue;
       border-radius: 10px;
    }
    
    .child2 span{
            padding: 0px;
            color: rgb(242, 244, 242);
    }

    
    .parent :first-child{
        background-color:blueviolet; 
        grid-column: span 3 ;
    }
    .parent :nth-child(2){
        background-color:  rgb(167, 207, 127);
        grid-column: span 3;
    }
    .parent :nth-child(4){
        background-color:  rgb(255, 34, 0);
        grid-column: span 2;
    }
    .parent :nth-child(5){
        background-color:  rgb(75, 162, 249);
        grid-column: span 2;
    }
    .parent :nth-child(6){
        background-color:  rgb(255, 0, 179);
        grid-column: span 3;
    }
    .parent :nth-child(3){
        background-color:  rgb(61, 120, 3);
        grid-row: span 2;
    }
</style>
<body>
    <div class="parent">
        <div class="child1">Header</div>
        <div class="child2">Nevigate</div>
        <div class="child3">Aside</div>
        <div class="child4">Content</div>
        <div class="child5">Section</div>
        <div class="child5">Footer</div>
    </div>
</body>
</html>
