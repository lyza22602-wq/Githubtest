<!DOCTYPE html>
<html lang="en">
<head>

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
    <title>Document</title>
</head>
<style>
    *{
        margin: 0;
        padding: 0;
        box-sizing:border-box ;

        display: flex;
    }
    .logo{

    }

        object-fit: cover;
    }
    .option{

        height: 100px;

        justify-content: center;
    }
    button{
        width: 100px;
        height: 40px;
        background-color: rgb(211, 70, 98);
        border-radius: 5px;
        border: none;
    }
</style>
<body>
    <nav>

        </div>
        <div class="option">
            <div class="menu">
                <span class="material-symbols-outlined">home</span>

            </div>
            <div class="menu">
                <span class="material-symbols-outlined">article_person</span>

            </div>
            <div class="menu">
                <span class="material-symbols-outlined">downhill_skiing</span>

            </div>
            <div class="menu">
                <span class="material-symbols-outlined">car_fan_recirculate</span>

            </div>
            <button>Login</button>
        </div>
    </nav>
</body>
</html>
