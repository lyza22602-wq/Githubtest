<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
       *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
       }  
       .box{
        width: 500px;
        height: 500px;
        background-color: rgb(194, 184, 184);
        transition: all 0.5s ease-in-out 0.5s;
       }  
       .box:hover{
        background-color: aqua;
       }


    </style>
</head>
<body>
    <div class="box"></div>
    
</body>
</html>
