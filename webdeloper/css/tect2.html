<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
        .box{
            width: 100%;
            height: 100vh;
            background-color: rgb(13, 66, 113);
            background-image: url("https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTg5pefm660dhBsuvaNLiq5gBCjt4EnADLmUBSaYb4mJg&s=10");
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
            background-attachment: fixed;
        }
        h1{
            color: white;
            padding-left: 170px;
            font-family: Arial, Helvetica, sans-serif;
            text-shadow: 0 0 10px pink;
        }
        .box2{
            width: 100%;
            height: 100vh;
            background-color: white;
            
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>This is background Image</h1>
    </div>
    <div class="box2"></div>
</body>
</html>
